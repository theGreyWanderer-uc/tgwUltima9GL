gl_moon_bright = 100
gl_moon_bloom = 100
gl_moon_halo = 100
gl_moon_halo_bloom = 100
# The discs' light and bloom dimmed by the phase shown, in percent of the settings
# above: new, crescent, half, gibbous (3/4), full. The halos are not; the game fades
