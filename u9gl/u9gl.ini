gl_fire_light = 1
gl_fire_strength = 100
gl_fire_dungeon_strength = 100
gl_fire_range = 500
gl_fire_textures = 6081,6082,4869,4870,4698,4699,5363,5364,5366,5367,5558,5559,5987
# Glow lights: glows the game draws with no light behind them, lit as the fires are
# but steady, with their own switch, strength (percent) and range (units) - apart from
