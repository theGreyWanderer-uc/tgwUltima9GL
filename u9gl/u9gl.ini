# fogged by how far each view ray crosses it, with drifting wisps, in the sheet's own
# colour. Density: percent of one optical depth per 1000 units. Soft: units over
# which it thins at the top. Height: units added to the sheet's. Noise: how much the
# wisps vary it, percent. Wisp: their size. Reach: how far a ray is followed. Keep:
# seconds a sheet is remembered off screen. The values suit Moonglow's shallow fog.
# Console: fog.
