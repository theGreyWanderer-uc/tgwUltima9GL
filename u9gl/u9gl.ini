gl_glow_light = 1
gl_glow_light_textures = 3078,3130
gl_glow_light_strength = 100
gl_glow_light_range = 600
# Faint glows brightened (percent): the column of light in Sir William Lett's tomb is
# painted so faint it barely shows from below. Console: pool glow gain N
gl_glow_gain = 100
gl_glow_gain_textures = 6413,6414
# The dark soot halo behind fires (6080, a wide cloud drawn black; 3077 and 7240 with
# campfires), in percent of the game's opacity: 100 as the game draws it, 0 gone -
# the dark cones above Stonegate's braziers. Console: pool fire soot <percent>.
gl_fire_soot = 0
gl_fire_soot_textures = 6080,3077,7240

# The runes of virtue: their symbols glow (only the symbol, found against the stone
# the first time each is seen) and each casts a small light in its symbol's colour.
# Console: pool rune on|off|strength <percent>|range <units>.
gl_rune_textures = 6812,6813,6814,6817,6819,6820,6821,6822
gl_rune_light = 1
gl_rune_light_strength = 75
gl_rune_light_range = 600
# How far a rune light's colour is pushed from grey, percent (100: the symbol's own,
# often pale - Honesty's hand reads almost white). The brightness stays with the
# strength. Console: pool rune saturation <percent>.
gl_rune_light_saturation = 400
# Runes whose symbol is plain grey stone glow and light white, untouched by the
