# u9gl.ini - U9GL's settings.
#
# The U9GL launcher (U9GL.exe) changes these for you; use it rather than editing
# here. Its own block at the end of this file wins over the defaults above it, and an
# update rewrites the defaults, so an edit made above that block does not last.
#
# Any key can be set for one run with an environment variable, U9GL_<KEY>, which
# wins over this file. Values accept 1/0, on/off, true/false, yes/no, a decimal
# number, or 0xHEX.

# ---------------------------------------------------------------------------
# Renderer
# ---------------------------------------------------------------------------

# 1: the OpenGL renderer runs on its own, with no Glide code, while Options.ini
# stays at 3. Needs own_renderer_life = 1. The launcher sets both.
rasterizer5 = 0
# 1: nGlide is not used at all.
own_renderer_life = 0

# Let Glide show its own frames. Leave this on when the game runs through Glide:
# turning it off there leaks memory and crashes. With the OpenGL renderer on its own
# (above) it is 0.
glide_present = 1

# When the game runs through Glide: 1: OpenGL owns the frame from the start. 0: a
# normal Glide game. Ctrl+F11 toggles.
takeover = 0

# ---------------------------------------------------------------------------
# Window
# ---------------------------------------------------------------------------

# 1: OpenGL gets its own top-level window beside the game, so both renderers are
# visible at once. Alt+Enter first, to put nGlide in a window.
gl_detach = 0
# The detached window's size and desktop position (-1 = beside the game).
gl_window_w = 960
gl_window_h = 720
gl_window_x = -1
gl_window_y = -1
# Where it sits on the game's monitor, keypad layout (7 top-left .. 3 bottom-right);
# 0 uses gl_window_x / gl_window_y.
gl_window_anchor = 0
# 0 gl_window_w x h, 1 the game's resolution fitted to the monitor, 2 the whole
# monitor, borderless.
gl_window_size = 0
# 1 stretches the picture to fill the window, ignoring the game's aspect.
gl_stretch = 0
# 1: our window is transparent to the mouse, so input reaches the game window.
gl_mouse_passthrough = 1
# 1: our window is kept on top of the game's window...
gl_topmost = 1
# ...but only while the game is in front.
gl_topmost_follows_focus = 1
# 1: while the game is in front, the cursor stays inside its window.
gl_confine_cursor = 1

# ---------------------------------------------------------------------------
# Display
# ---------------------------------------------------------------------------

# Wider than 4:3: keep the 4:3 height and show more at the sides.
# 0 = the original, 1 = books only, 2 = the whole game.
wide_view = 2

# ---------------------------------------------------------------------------
# Picture
# ---------------------------------------------------------------------------

# Two different fogs. fog: the fade at the far edge of the view that hides objects
# appearing. fog_table: the game's distance haze.
fog = 1
fog_table = 1

# How depth is worked out: 0 and 1 are simpler methods, 2 matches Glide (and falls
# back to 1 on cards without shaders). Ctrl+F5 cycles it.
depth_mode = 2
# Fallback view distance for depth_mode 1 and 2; the game's own is normally used.
depth_far = 8192
# 1: depth rounded to the precision of Glide's W-buffer (steps of distance / 4096), so
# surfaces almost on top of each other settle as they did on a Voodoo card instead of
# flickering as the camera moves. 0: full precision. Console: post depth glide on|off.
gl_depth_glide = 1

# Smaller texture copies at a distance: 0 none, 1 as Glide draws them, 2 trilinear.
mip_filter = 1
# Anisotropic filtering, for ground seen at a low angle. 0 or 1 turns it off.
anisotropy = 8
# Alpha-test threshold, 0..255: how opaque a texel must be to draw.
alpha_ref = 128
# Textures the game draws with a solid magenta background meant to be transparent - its
# own bug, in stock Glide too: flames, fireballs, sparkles, lava bursts, the streak
# behind a flame arrow, a banner's notched top. Magenta is cut out of these as Glide's
# colour key would; a frame with no magenta cuts out its own corner colour instead.
# fix_magenta_key = 0 draws them as the game does.
fix_magenta_key = 1
gl_magenta_key_textures = 1046,1623,2348,2365,2372,2501,3104,4462,4561,4960,5017,5034,5036,5219,5353,5602,5603,5984,6146,6273,6390,6395,7002,7348
# Colours keyed out of the game's composed screens (the opened town maps' flat pink
# background behind the torn parchment edge), as 15-bit hex: 5 bits each of red, green,
# blue. 7D3E is red 31, green 9, blue 30. Empty: drawn as the game draws them.
gl_composed_key_colours = 7D3E
# Textures with magenta blur along their edges (the snowy pines' snow, 2553): those pink
# pixels take the colour of their clean neighbours. Empty: drawn as the game draws them.
gl_defringe_textures = 2553
# Texture filtering: 0 smooth everywhere, 1 as the game asks for each surface,
# 2 blocky everywhere. Ctrl+F7 cycles it.
point_filter = 1

# ---------------------------------------------------------------------------
# Texture replacement
# ---------------------------------------------------------------------------

# 1: image files in the "textures" folder beside this file replace the game's
# textures of the same id (<id>_<id2>...png/.tga/.bmp, powers of two). 0: nothing
# is read.
texture_override = 0
# Largest accepted edge, in texels. 2048 costs 21 MB per texture.
texture_override_max = 2048

# ---------------------------------------------------------------------------
# Brightness
# ---------------------------------------------------------------------------

# 1: the game's brightness is applied with a gamma ramp, which changes the whole
# display, not just the game. 0 leaves the display alone.
gl_gamma_apply = 0
# 1: with gl_post (below), the game's brightness (GammaRed in Options.ini, 1.0
# neutral) is applied to the game's window only, instead of gl_gamma_apply's
# display-wide ramp.
gl_post_gamma = 1

# ---------------------------------------------------------------------------
# Graphics: enhanced graphics
# ---------------------------------------------------------------------------

# 1: draw each frame offscreen and copy it to the window through a final pass. On its
# own it changes nothing on screen; everything in the Graphics sections below needs
# it. The launcher's Graphics page, "Enhanced graphics".
gl_post = 1

# Anti-aliasing: smooths stair-stepped edges, and some of the shimmer of leaves and
# fences, by filtering the finished picture (FXAA-style). The game's interface - the
# belt, the bars, the compass - and the menus stay sharp. Threshold: how strong a step
# in brightness counts as an edge, per mille of the brighter side (lower smooths more).
# Subpix: how much single-pixel detail is softened, percent. Needs gl_post.
# Console: post aa on|off, view, threshold <n>, subpix <n>.
gl_aa = 1
gl_aa_threshold = 125
gl_aa_subpix = 75
# Supersampling: draw the picture at 2 or 3 times the window's width and height and
# average it down. Smooths every edge and most of the shimmer, where the filter above
# cannot, at a large cost: 2 draws four times the pixels, 3 nine times, which few
# cards keep up with. 1 is off. While it is on, the filter above stands down. Needs
# gl_post. Console: post ss 1|2|3.
gl_ss_scale = 1

# The game's screenshot key, Ctrl+P, saving into the game folder. 0: nothing.
# 1: the game's picture before U9GL's lighting, shadows, fog and grade, as
# u9-<n>-before.png. 2: the finished picture, as u9-<n>-after.png. 3: the finished
# picture as the game's own u9-<n>.tga. 4: both PNGs of the same frame, to compare.
# Shots leave out the game's interface (belt, bars, compass), the metrics panel and
# the console. Print Screen is left to Windows; Ctrl+F9 saves its own frame dump.
gl_screenshot = 0

# ---------------------------------------------------------------------------
# Graphics: lamp light
# ---------------------------------------------------------------------------

# Light pools: the game's candles, torches and lamps lit per pixel and kept on their
# own side of walls, where the game's own light passes through walls.
# Console: pool on|off.
gl_light_pools = 1
# 1: while the pools are on, the game's own lights are switched off so the pools
# replace them rather than add to them. 0 keeps both.
gl_light_replace = 1
# 1: keep each light in its room: it reaches outside only through an open window
# or doorway.
gl_light_contain = 1
# 1: keep outdoor lights out of the rooms nearby, except through an open window or
# doorway - a street lamp stays out of the house beside it.
gl_light_keep_out = 1
# 1: also test each pool against the walls on screen. Off: it cannot tell a wall
# from a crate, and casts hard shadows.
gl_light_march = 0

# The pools' brightness, percent.
gl_light_strength = 100
# Push the pools' colour warm, percent (0 = the game's own colour).
gl_light_warmth = 100
# 1: ease bright pool light toward white, keeping its hue, instead of clipping an
# orange pool to flat yellow.
gl_light_soft = 0
# A long faint tail under each light: where the game's falloff drops below
# tail_level (percent of full), the tail carries on to tail_reach (percent of the
# light's range). 1 = only on light leaving a room through an open door or window;
# 2 = everywhere, a soft fill in rooms too; 0 = off.
gl_light_tail = 2
gl_light_tail_level = 25
gl_light_tail_reach = 175

# Candles and torches flicker only near you in the original game; farther out a light
# freezes. While the pools are on, lights flicker out to this distance (0 = the
# game's own, Options.ini FlickerRange). Saves keep the game's value.
gl_light_flicker_range = 5000
# Ease each flicker step over this many ms, so a pool breathes instead of jumping
# 12 times a second. 0 = the game's steps as they come.
gl_light_flicker_smooth = 150

# How many lights the pools draw at most, 1-128. More lights cost the most where many
# overlap, such as busy streets at night; lower it on a slower graphics card.
# Console: pool max <n>.
gl_light_max = 128
# Which lights, when more are near than gl_light_max: 1: those that light the most
# of the view; 0: the nearest, which can switch a pool on or off as you move.
gl_light_rank = 1
# A light joining or leaving fades over this many ms instead of popping. 0 = no fade.
gl_light_fade = 250

# Fill lights: invisible lights the game places by the dozen in dungeons to lift the
# dark. As pools they show as bright spots and rings with nothing there. 1: left out,
# except on the maps listed: 9 Britannia, 14 the Avatar's house on Earth. Map 63, also
# named Earth, is another place and is not listed.
gl_fill_lights_cut = 1
gl_fill_lights_keep = 9,14

