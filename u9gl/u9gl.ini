# ---------------------------------------------------------------------------
# Graphics: sun rays
# ---------------------------------------------------------------------------

# Sun rays: the sky near the sun smeared toward it on screen, so gaps between
# branches, roofs and hills throw shafts. Strength: percent. Decay: percent each step
# back toward the sun keeps. Length: percent of the way to the sun a ray reaches.
# Samples: steps per pixel, up to 128. Threshold: sky darker than this percent throws
# nothing. Radius: sky further from the sun than this percent of the screen's height
# throws nothing. Air: units of air in front of a surface that take 63% of the rays
# (the sky takes them all), so near things such as the Avatar get little; 0: every
# pixel alike. Off underground, at night, in storms and with the sun behind you.
# Console: rays.
gl_sun_rays = 1
gl_sun_rays_strength = 200
gl_sun_rays_decay = 97
gl_sun_rays_length = 150
gl_sun_rays_samples = 64
gl_sun_rays_threshold = 30
gl_sun_rays_radius = 20
gl_sun_rays_air = 1000
# Moon rays: the same toward each moon, from the moons' glow (so they need bloom on),
# in their own colours and at their phase. Percent, 0 off; radius as the sun's.
gl_moon_rays = 100
gl_moon_rays_radius = 25
# The game's own sun glare, the wash over the screen when facing the sun: 0 hides it.
# Scale: percent of its strength, 100 as the game draws it; 30 leaves room for the
# sun rays. Console: rays glare.
gl_sun_glare = 1
gl_sun_glare_scale = 30

# ---------------------------------------------------------------------------
# Graphics: ambient occlusion and contact shadows
# ---------------------------------------------------------------------------

# Ambient occlusion: corners, contact points and the feet of things darkened, worked
# out from the depth - where a wall meets the floor, under a crate, at a tree's foot.
# Radius: world units round a point that can shade it (the Avatar is about 180 tall).
# Strength: percent. Distance: gone by this far from the eye. Applied before the lamp
# light, so lamps still fill the corners; never on the sky, effects or the interface.
# Needs gl_post. Console: post ao on|off, view, radius, strength, distance, samples.
gl_ao = 1
gl_ao_radius = 60
gl_ao_strength = 300
gl_ao_distance = 3000
gl_ao_samples = 12
# Contact shadows: from each point facing the sun, a short march toward it through
# the depth, for feet, the foot of a post, a crate's edge - small things the sun's
# shadows are too coarse for. They fade with the sun shadows (dusk, storm, rooms,
# distance) and need gl_sun_shadows. Length: world units marched (the Avatar is about
# 180 tall). Thickness: how far behind a blocker a step may lie and still be in its
# shadow; more, and a near figure shades the wall behind it. Distance: gone by this
# far from the eye.
# Console: post contact on|off, view, length, steps, thickness, distance.
gl_contact = 1
gl_contact_length = 40
gl_contact_steps = 12
gl_contact_thickness = 30
gl_contact_distance = 2000

# ---------------------------------------------------------------------------
# Graphics: water reflections
# ---------------------------------------------------------------------------

# Water reflections: what is on screen mirrored in the water, by Fresnel - faint
# looking straight down, so the bed still shows through near the Avatar, stronger
# toward the far shore. A ray that leaves the screen takes the last land or sky it
# passed over. Needs gl_post, gl_water_depth and a graphics card with 7 draw buffers.
# Strength: percent of the Fresnel share. Distance: world units the reflected ray is
# followed. Console: post water on|off, view, strength, distance, steps.
gl_water_reflect = 1
gl_water_reflect_strength = 100
gl_water_reflect_distance = 8000
gl_water_reflect_steps = 32
# Floor: percent the reflection never falls below. The chase camera sees nearby water
# steeply, where Fresnel alone gives 3-18%, too little to show the mirror. 0: Fresnel
# alone. Console: post water floor <percent>.
gl_water_reflect_floor = 25
# Mirror from memory: the world's triangles are kept after they leave the screen and
# drawn mirrored under the water, so the reflection stays while the camera tips down;
# where nothing is mirrored, the sky's horizon colour. 0: the screen-only reflection
# above. Keep: seconds an unseen triangle is kept. Reach: world units round the
# camera. Console: post water memory on|off|forget, keep <s>, reach <units>.
gl_water_reflect_memory = 1
gl_water_reflect_keep = 30
gl_water_reflect_reach = 6000

