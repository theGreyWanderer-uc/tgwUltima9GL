# ---------------------------------------------------------------------------
# Graphics: lamp shadows
# ---------------------------------------------------------------------------

# Shadows from lamps, with the light pools. Only what is on screen can cast.
# Console: pool shadow ...
gl_light_shadows = 1
# How many lamps cast shadows at once, 1-8: the one lighting the Avatar most first,
# then those lighting the most of the view. Each one costs drawing time.
gl_light_shadow_count = 8
# Shadow detail per lamp. Larger is sharper and costs more.
gl_light_shadow_size = 512
# 1: fences, foliage and other see-through surfaces cast with their holes.
gl_light_shadow_cutouts = 1
# 1: hide the game's round shadow under characters while lamp shadows are on.
gl_light_shadow_hide_blob = 1

# ---------------------------------------------------------------------------
# Graphics: sun shadows
# ---------------------------------------------------------------------------

# Buildings, trees and characters shade the ground away from the sun, and rooms are
# shaded unless the sun comes in through an open door or window. A lamp in a sun
# shadow still lights. Off underground; fades at dusk, in storms and with the sun
# low (gl_sun_shadow_min). The launcher's Graphics page, "Sun shadows".
# Console: sun shadow ...
gl_sun_shadows = 1
# Percent of the light a sun shadow takes.
gl_sun_shadow_strength = 60
# Degrees above the horizon below which the sun casts nothing.
gl_sun_shadow_min = 5
# How far sun shadows reach around the camera, and their detail.
gl_sun_shadow_range = 10000
gl_sun_shadow_size = 2048
# 1: a sharper set of shadows near the Avatar, out to gl_sun_shadow_near, and softer
# ones beyond; 0: one set out to the range.
gl_sun_shadow_cascades = 1
gl_sun_shadow_near = 1000
# 1: remember roofs and upper walls after they leave the screen, so a roof still
# shades its floor while you look down. gl_sun_shadow_keep: when the memory fills,
# what has gone unseen this many seconds is forgotten first.
gl_sun_shadow_memory = 1
gl_sun_shadow_keep = 120
# What the memory keeps: triangles more than this far above the camera. -5000 keeps
# everything, so a tree's shadow stays as the camera turns away from it; 0 keeps only
# roofs and upper walls.
gl_sun_shadow_above = -5000
# Sun shadows fade out between these distances from the camera. The far hills are
# drawn in coarse detail, where shadows would show as hard dark wedges; beyond the
# fade they keep the game's own lighting. Equal values: no fade.
gl_sun_shadow_fade_from = 2500
gl_sun_shadow_fade_to = 4000
# Extra units a surface may sit behind the sun map's nearest surface and still count
# as lit, if the ground ever shades itself in speckle. Larger leaves a lit strip
# between a trunk's foot and its shadow under a low sun. The lamps' shadows have
# their own.
gl_sun_shadow_bias = 0
# 1: a wall turned away from the sun is fully shaded as soon as it is past edge-on.
# Under a high sun no wall turns far enough away for the ground's gradual shade, and
# walls would show lit bands beside their building's shadow. 0: walls graded like
# the ground.
gl_sun_shadow_walls = 1
# 1: a building or tree is drawn into a sun shadow map only if it can shade something
# in it - inside the map's area, and near enough for its shadow to show before the
# shadows fade out (gl_sun_shadow_fade_to plus 2000). Shadows look the same, with far
# fewer draws, which matters with a long building draw distance. 0: everything into
# every map.
gl_sun_shadow_cull = 1
# The sun's shadows follow it in steps: the direction moves every gl_sun_shadow_step
# ms and each new one fades in over gl_sun_shadow_xfade ms. Following every tick of
# the game's clock makes distant tree shadows flicker while you stand still. While
# fading, the sun's maps are drawn twice. 0 step: follow it every frame.
gl_sun_shadow_step = 2000
gl_sun_shadow_xfade = 1000
# 1: the water's surface is written into the depth after each frame, so sun and lamp
# shadows and the lamps' light land on the water, not on the bed seen through it.
gl_water_depth = 1

